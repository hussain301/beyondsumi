<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" aria-labelledby="title desc" role="img" viewBox="0 0 1500 850"><title id="title">Sumi Original, Sumi Light and Sumi Dark</title><desc id="desc">A static teaching atlas. Original preserves a painted landscape and articulated gesture. Light uses colorful pigment and checked pose animation. Dark uses large splash-built subjects and camera-led ink journeys in black, grey and dark red. These schematic illustrations do not demonstrate completed motion.</desc><defs><filter id="rough" width="124%" height="124%" x="-12%" y="-12%"><feTurbulence baseFrequency=".055" numOctaves="3" result="n" seed="11" type="fractalNoise"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter><pattern id="paper" width="57" height="43" patternUnits="userSpaceOnUse"><path fill="none" stroke="#777" stroke-opacity=".1" stroke-width=".6" d="M4 5l8 2m27 15l10-2M15 37l9-1M50 4l-3 9"/></pattern><g id="mountains" filter="url(#rough)"><path fill="currentColor" d="M0 205L58 145 100 180 168 83 216 142 275 98 390 210Z" opacity=".11"/><path fill="currentColor" d="M0 229L72 194 111 211 205 151 274 195 331 166 390 237Z" opacity=".17"/><path fill="none" stroke="currentColor" stroke-width="7" d="M6 253Q105 224 195 249T385 246" opacity=".22"/></g><g id="branch" fill="none" stroke="currentColor" stroke-linecap="round" filter="url(#rough)"><path stroke-width="8" d="M165 262Q177 218 174 183Q168 145 200 103"/><path stroke-width="4.4" d="M176 187Q207 169 235 141M176 161Q145 144 132 119"/><path stroke-width="2.5" d="M200 104L226 84M236 142L257 128M133 122L112 113M201 166L214 136"/></g><g id="wash" fill="currentColor" filter="url(#rough)"><path d="M100 111C82 88 116 72 143 84C143 58 188 51 207 73C232 51 262 75 253 93C283 91 294 123 269 136C261 160 223 154 211 143C181 168 155 151 153 133C124 147 98 132 100 111Z" opacity=".21"/><path fill="none" stroke="currentColor" stroke-width="13" d="M108 112Q130 88 154 110T204 95T262 111" opacity=".38"/><circle cx="102" cy="145" r="3" opacity=".5"/><circle cx="275" cy="81" r="2.5" opacity=".4"/><circle cx="232" cy="63" r="2"/><circle cx="85" cy="115" r="1.6"/><circle cx="282" cy="143" r="4" opacity=".18"/></g></defs><rect width="1500" height="850" fill="#f5f4f0"/><g fill="#202322" font-family="Georgia,serif"><text x="55" y="65" font-size="39">SUMI</text><text x="1445" y="61" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="end">THREE FINAL STYLES</text></g><path stroke="#292d29" stroke-opacity=".25" d="M55 88H1445"/><g transform="translate(55 119)"><rect width="440" height="420" fill="#eeeadd" rx="3"/><rect width="440" height="420" fill="url(#paper)"/><g color="#242b29" transform="translate(25 60)"><use href="#mountains"/><use href="#branch" transform="translate(70 0)"/><path fill="none" stroke="#5b6152" stroke-width="4" d="M246 237Q251 204 260 182"/><path fill="#a34537" d="M258 184C236 183 229 203 205 195S170 182 156 194C178 188 180 209 203 208S236 194 260 191Z" filter="url(#rough)"/><g fill="#242b29" filter="url(#rough)"><circle cx="115" cy="197" r="8"/><path d="M110 204L123 204 132 237 101 238Z"/><path d="M106 235L101 261 108 262 117 238 125 260 132 260 126 235Z"/><path d="M123 209L141 217 156 208 159 212 143 223 124 219Z"/></g><path fill="none" stroke="#242b29" stroke-opacity=".2" stroke-width="9" d="M21 100C72 49 144 117 194 70S294 44 339 75" filter="url(#rough)"/><g fill="#a34537" opacity=".7"><ellipse cx="274" cy="126" rx="5" ry="2" transform="rotate(-22 274 126)"/><ellipse cx="305" cy="153" rx="4" ry="2" transform="rotate(25 305 153)"/></g></g><text x="25" y="34" fill="#51584e" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4">PRESERVED PAINTED IDENTITY</text><path fill="none" stroke="#242b29" stroke-opacity=".25" d="M29 380Q190 375 395 381"/></g><g transform="translate(530 119)"><rect width="440" height="420" fill="#F3EFE6" rx="3"/><rect width="440" height="420" fill="url(#paper)"/><g transform="translate(25 60)"><use color="#1D3B58" href="#mountains"/><use color="#2E6F5E" href="#wash"/><use color="#C89B3C" href="#wash" transform="translate(50 40) scale(.64)"/><use color="#111114" href="#branch"/><path fill="none" stroke="#1D3B58" stroke-width="9" d="M195 258Q260 242 347 256" filter="url(#rough)" opacity=".17"/><path fill="#D3381C" d="M210 95L220 81 230 91 219 103Z" filter="url(#rough)" opacity=".8"/><path fill="#D3381C" d="M272 180Q281 172 286 177Q282 186 272 180"/><circle cx="62" cy="250" r="11" fill="#1D3B58" filter="url(#rough)" opacity=".17"/><circle cx="49" cy="237" r="3" fill="#111114" opacity=".35"/></g><text x="25" y="34" fill="#51584e" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4">COLOUR IN THE BRUSH</text><path fill="none" stroke="#111114" stroke-opacity=".25" d="M29 380Q190 375 395 381"/></g><g transform="translate(1005 119)"><rect width="440" height="420" fill="#fff" rx="3"/><rect width="440" height="420" fill="url(#paper)"/><g color="#111" filter="url(#rough)" transform="translate(25 60)"><path fill="#111" d="M8 102Q82 17 176 65T383 17L378 63Q296 124 201 95T18 146Z" opacity=".13"/><path fill="#111" d="M10 265Q99 215 185 259T382 220L377 285Q270 267 191 285T8 286Z" opacity=".33"/><path fill="#111" d="M190 137Q179 107 205 89Q229 83 238 108L237 132 260 151Q275 175 282 202L327 259Q277 276 244 248L231 287 208 288 212 239 191 273 165 267 185 222Q146 221 129 242L112 225 163 171Z"/><path fill="#111" d="M195 159Q163 167 129 178L83 205 68 196 117 167 181 141Z"/><path fill="#111" d="M238 155L268 159 307 138 319 145 276 179 249 177Z"/><path fill="#eee" d="M195 110L204 132 223 125 229 106 214 98Z"/><path stroke="#7A1622" stroke-width="4" d="M209 112L225 110"/><path fill="#7A1622" d="M199 137Q245 126 265 106Q249 143 213 148L263 191Q217 171 191 153Z"/><path fill="#111" d="M267 199Q310 213 347 218L341 230Q298 235 270 218Z" opacity=".6"/><path fill="none" stroke="#eee" stroke-width="5" d="M219 171L222 213 210 231M249 180L259 202" opacity=".72"/><g fill="#111"><ellipse cx="91" cy="222" rx="17" ry="8"/><ellipse cx="326" cy="202" rx="14" ry="6"/><circle cx="65" cy="184" r="5"/><circle cx="342" cy="246" r="8"/><circle cx="117" cy="256" r="6"/><circle cx="301" cy="112" r="4"/></g></g><text x="25" y="34" fill="#555" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4">LARGE SPLASH FORMS · CAMERA-LED</text><path fill="none" stroke="#111" stroke-opacity=".25" d="M29 380Q190 375 395 381"/></g><g fill="#222" font-family="Arial,sans-serif"><g><text font-family="Georgia,serif" font-size="31" transform="translate(55 586)">Sumi Original</text><text y="36" font-size="18" transform="translate(55 586)">Emotional stories · smoother Sumi-e acting</text><text y="69" fill="#555" font-size="16" transform="translate(55 586)">30fps · action-driven drawing exposures.</text><text y="94" fill="#555" font-size="16" transform="translate(55 586)">Love, companionship and heartfelt stories.</text></g><g><text font-family="Georgia,serif" font-size="31" transform="translate(530 586)">Sumi Light</text><text y="36" font-size="18" transform="translate(530 586)">Documentaries · colourful brush storytelling</text><text y="69" fill="#555" font-size="16" transform="translate(530 586)">24 FPS output / character poses on twos.</text><text y="94" fill="#555" font-size="16" transform="translate(530 586)">Story-selected colour · checked pose sheets.</text></g><g><text font-family="Georgia,serif" font-size="31" transform="translate(1005 586)">Sumi Dark</text><text y="36" font-size="18" transform="translate(1005 586)">Dark stories · large brush and splash forms</text><text y="69" fill="#555" font-size="16" transform="translate(1005 586)">Camera-led depth, reveals and ink journeys.</text><text y="94" fill="#555" font-size="16" transform="translate(1005 586)">Black, grey and purposeful dark red.</text></g><path stroke="#222" stroke-opacity=".2" d="M55 731H1445"/><text x="55" y="773" font-size="18">Story first. Visible acting, meaningful camera, weather, sparse transitions and synchronized sound.</text><text x="55" y="809" fill="#666" font-size="14">Schematic onboarding art · specifications, not motion proof · Original 30fps/variable exposures · Light/Dark 24fps/on-twos</text></g></svg>